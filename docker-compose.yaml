services:
  wtd:
    build: .
    image: ${DOCKER_IMAGE}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/root/data
      - ./temp:/root/temp
    networks:
      wtd-net:

  trksim:
    build: ./ae/trksim
    networks:
      wtd-net:
        aliases:
          - www.internal
          - trk.internal

networks:
  wtd-net:
    name: ${DOCKER_NET}
